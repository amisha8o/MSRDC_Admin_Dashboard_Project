<!DOCTYPE html>
<html>

<head>

    <title>MSRDC Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h3 class="logo">MSRDC</h3>

        <ul>

            <li>
                <a href="#">
                    <i class="fa fa-home"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa fa-table"></i>
                    Master
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa fa-chart-bar"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa fa-cog"></i>
                    Settings
                </a>
            </li>

        </ul>

    </div>


    <!-- MAIN CONTENT -->

    <div class="main-content">

        <!-- TOPBAR -->

        <div class="topbar">

    <div>

        <h2>Dashboard</h2>

        <p class="text-muted">
            Welcome Back Admin
        </p>

    </div>


    <div class="top-right">

        <input type="text"
            placeholder="Search..."
            class="search-box">

        <i class="fa fa-bell notification-icon"></i>

        <img src="https://i.pravatar.cc/40"
            class="profile-img">

    </div>

</div>

            <h2>Dashboard</h2>

            <button id="darkBtn" class="btn btn-dark">
                Dark Mode
            </button>

        </div>


        <!-- CARDS -->

        <div class="row mt-4">

            <div class="col-md-3">

                <div class="card dashboard-card">

                    <h5>Total Users</h5>

                    <h2>120</h2>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card dashboard-card">

                    <h5>Transactions</h5>

                    <h2>350</h2>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card dashboard-card">

                    <h5>Revenue</h5>

                    <h2>₹80K</h2>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card dashboard-card">

                    <h5>Pending</h5>

                    <h2>15</h2>

                </div>

            </div>

        </div>

        <!-- CHART -->

<div class="card mt-5 p-4">

    <h4>Revenue Overview</h4>

    <canvas id="myChart"></canvas>

</div>


        <!-- TABLE -->

        <div class="card mt-5 p-3">

            <h4>User Data</h4>

            <table class="table table-bordered mt-3">

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>1</td>
                    <td>Amisha</td>
                    <td>Active</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Rahul</td>
                    <td>Pending</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Riya</td>
                    <td>Active</td>
                </tr>

            </table>

        </div>

    </div>


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>

</html>
