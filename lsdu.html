<!DOCTYPE html>
<html>

<head>

    <title>LSDU Status</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h3 class="logo">MSRDC</h3>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa fa-home"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="master.html">
                    <i class="fa fa-table"></i>
                    Master
                </a>
            </li>

            <li>
                <a href="transaction.html">
                    <i class="fa fa-money-bill"></i>
                    Transactions
                </a>
            </li>

            <li>
                <a href="lsdu.html">
                    <i class="fa fa-chart-line"></i>
                    LSDU Status
                </a>
            </li>

        </ul>

    </div>


    <!-- MAIN -->

    <div class="main-content">

        <div class="topbar">

            <h2>LSDU Status Display</h2>

            <button class="btn btn-dark" id="darkBtn">
                Dark Mode
            </button>

        </div>


        <!-- STATUS CARDS -->

        <div class="row mt-4">

            <div class="col-md-3">

                <div class="status-card bg-success">

                    <i class="fa fa-check-circle"></i>

                    <h4>Online</h4>

                    <p>15 Devices</p>

                </div>

            </div>


            <div class="col-md-3">

                <div class="status-card bg-danger">

                    <i class="fa fa-times-circle"></i>

                    <h4>Offline</h4>

                    <p>3 Devices</p>

                </div>

            </div>


            <div class="col-md-3">

                <div class="status-card bg-warning">

                    <i class="fa fa-exclamation-circle"></i>

                    <h4>Warning</h4>

                    <p>5 Alerts</p>

                </div>

            </div>


            <div class="col-md-3">

                <div class="status-card bg-primary">

                    <i class="fa fa-server"></i>

                    <h4>Servers</h4>

                    <p>8 Active</p>

                </div>

            </div>

        </div>


        <!-- LIVE STATUS TABLE -->

        <div class="card mt-5 p-3">

            <h4>Live Device Status</h4>

            <table class="table table-bordered mt-3">

                <tr>

                    <th>Device ID</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Updated</th>

                </tr>


                <tr>

                    <td>LSDU101</td>
                    <td>Mumbai Toll</td>

                    <td>
                        <span class="badge bg-success">
                            Online
                        </span>
                    </td>

                    <td>2 Min Ago</td>

                </tr>


                <tr>

                    <td>LSDU102</td>
                    <td>Pune Toll</td>

                    <td>
                        <span class="badge bg-danger">
                            Offline
                        </span>
                    </td>

                    <td>10 Min Ago</td>

                </tr>

            </table>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
